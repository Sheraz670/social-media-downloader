<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Movie Explainer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;

      background:
        radial-gradient(circle at top left, #6a5cff 0%, transparent 35%),
        radial-gradient(circle at bottom right, #00c6ff 0%, transparent 35%),
        linear-gradient(135deg, #111827, #1e293b);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;

      background: rgba(255, 255, 255, 0.97);

      padding: 32px;

      border-radius: 20px;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
      color: #111827;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    input,
    select {
      width: 100%;
      padding: 15px;

      margin-top: 15px;

      border: 1px solid #ddd;
      border-radius: 10px;

      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #6a5cff;
      box-shadow: 0 0 0 3px rgba(106,92,255,0.12);
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 15px;

      border: 0;
      border-radius: 10px;

      background: #111827;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .hidden {
      display: none;
    }

    .section-title {
      margin-top: 25px;
      margin-bottom: 8px;

      font-weight: bold;
      color: #111827;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      color: #333;
      line-height: 1.5;
    }

    .duration-box {
      margin-top: 20px;
      padding: 20px;

      background: #f8fafc;

      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 AI Movie Explainer</h1>

    <p>
      Create an original movie explanation with AI narration.
    </p>

    <!-- STEP 1 -->
    <div id="movieSection">

      <input
        type="text"
        id="movieInput"
        placeholder="Enter movie name or permitted video URL"
      >

      <button onclick="showOptions()">
        Continue
      </button>

    </div>


    <!-- STEP 2 -->
    <div id="optionsSection" class="hidden">

      <div class="duration-box">

        <div class="section-title">
          ⏱️ How long should the script be?
        </div>

        <select id="duration">

          <option value="5">
            5 Minutes
          </option>

          <option value="8">
            8 Minutes
          </option>

          <option value="10" selected>
            10 Minutes
          </option>

          <option value="12">
            12 Minutes
          </option>

          <option value="15">
            15 Minutes
          </option>

        </select>


        <div class="section-title">
          🌎 Choose language
        </div>

        <select id="language">

          <option value="English">
            English
          </option>

          <option value="Urdu">
            Urdu
          </option>

          <option value="Hindi">
            Hindi
          </option>

        </select>


        <button onclick="generateExplanation()">
          ✨ Generate Script
        </button>

      </div>

    </div>


    <div id="status"></div>

  </div>


  <script>

    function showOptions() {

      const input =
        document.getElementById("movieInput")
          .value
          .trim();

      const status =
        document.getElementById("status");


      if (!input) {

        status.textContent =
          "Please enter a movie name or video URL.";

        return;
      }


      status.textContent = "";

      document.getElementById(
        "optionsSection"
      ).classList.remove("hidden");

    }


    async function generateExplanation() {

      const input =
        document.getElementById("movieInput")
          .value
          .trim();

      const duration =
        document.getElementById("duration")
          .value;

      const language =
        document.getElementById("language")
          .value;

      const status =
        document.getElementById("status");


      if (!input) {

        status.textContent =
          "Please enter a movie name or video URL.";

        return;
      }


      status.textContent =
        "🤖 Creating your " +
        duration +
        "-minute " +
        language +
        " movie explanation... Please wait.";


      try {

        const response =
          await fetch(
            "https://social-media-downloader-f8pv.onrender.com/api/movie-explainer",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                input: input,

                duration: duration,

                language: language

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error"
          );

        }


        status.textContent =
          data.message ||
          "✅ Script generation started.";

      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Error: " +
          error.message;

      }

    }

  </script>

</body>
</html>
